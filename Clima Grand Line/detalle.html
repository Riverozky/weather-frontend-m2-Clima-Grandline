<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Clima</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="weather-app">

    <nav class="navbar navbar-dark bg-primary weather-app__header">
        <div class="container">
            <a class="navbar-brand" href="index.html">⬅ Volver</a>
        </div>
    </nav>

    <main class="weather-app__content container my-5">

        <section class="weather-detail card shadow">
            <div class="row g-0">
                <div class="col-md-4 weather-detail__image">
                    <img id="img-detalle" class="img-fluid" alt="Isla">
                </div>
                <div class="col-md-8">
                    <div class="card-body weather-detail__info">
                        <h2 id="nombre-ciudad"></h2>
                        <h3 id="temp-actual"></h3>
                        <p id="estado-clima"></p>

                        <div class="weather-detail__extra">
                            <span class="badge bg-info">Viento: <span id="viento"></span> km/h</span>
                            <span class="badge bg-warning text-dark">Humedad: <span id="humedad"></span>%</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="weather-app__footer text-center py-3">
        <p>Datos simulados – One Piece Weather</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
