<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Clima - Grand Line</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="weather-app">

    <nav class="navbar navbar-dark bg-primary weather-app__header sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span>Volver al Mapa</span> 
            </a>
        </div>
    </nav>

    <main class="weather-app__content container my-4">
        <section class="weather-detail card shadow mb-5 border-0 overflow-hidden">
            <div class="row g-0 align-items-center">
                <div class="col-md-5 weather-detail__image">
                    <img id="img-detalle" class="img-fluid h-100 w-100" style="object-fit: cover; min-height: 300px;" alt="Isla">
                </div>
                <div class="col-md-7">
                    <div class="card-body p-4 text-center text-md-start">
                        <h2 id="nombre-ciudad" class="display-5 fw-bold text-primary mb-0"></h2>
                        <p id="ciudad-real-info" class="text-muted small mb-3"></p>
                        
                        <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-3 mb-3">
                            <h3 id="temp-actual" class="display-3 fw-bold mb-0"></h3>
                            <span id="estado-clima" class="badge bg-light text-dark border p-2 fs-6"></span>
                        </div>

                        <div class="weather-detail__extra d-flex gap-2 justify-content-center justify-content-md-start">
                            <span class="badge bg-info bg-opacity-10 text-info border border-info p-2">💨 Viento: <span id="viento"></span> km/h</span>
                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning p-2">💧 Humedad: <span id="humedad"></span>%</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="row">
            <div class="col-lg-7 mb-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white fw-bold py-3 text-primary">📅 Pronóstico de la Semana (API)</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 text-center align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Día</th>
                                        <th class="text-primary">Min</th>
                                        <th class="text-danger">Max</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="pronostico-dias"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm border-0 h-100 bg-primary text-white">
                    <div class="card-body">
                        <h4 class="card-title fw-bold mb-4">📊 Análisis de Ruta</h4>
                        <div class="row text-center mb-4">
                            <div class="col-4">
                                <span class="d-block small opacity-75">Promedio</span>
                                <span id="stat-promedio" class="fs-2 fw-bold"></span>
                            </div>
                            <div class="col-4 border-start border-white border-opacity-25">
                                <span class="d-block small opacity-75">Mínima</span>
                                <span id="stat-min" class="fs-4"></span>
                            </div>
                            <div class="col-4 border-start border-white border-opacity-25">
                                <span class="d-block small opacity-75">Máxima</span>
                                <span id="stat-max" class="fs-4"></span>
                            </div>
                        </div>

                        <div class="alert alert-light text-dark border-0 shadow-sm mb-4">
                            <h6 class="fw-bold mb-1">📝 Resumen Semanal:</h6>
                            <p id="resumen-texto" class="mb-0 small fst-italic"></p>
                        </div>

                        <div id="contenedor-alertas" class="mt-3">
                            <h6 class="fw-bold mb-2 text-warning">⚠️ Alerta de Navegación:</h6>
                            <div id="alerta-clima" class="p-2 rounded bg-white text-dark small fw-bold">
                                Analizando corrientes...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="weather-app__footer text-center py-4 mt-auto">
        <p class="mb-0">Proyecto App Clima - Grand Line</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
